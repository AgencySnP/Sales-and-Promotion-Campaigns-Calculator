<!DOCTYPE html>
<html>
<head>
    <title>S&P Campaigns Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#006341;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
            margin-top:40px;
        }

        .card{
            background:white;
            border-radius:12px;
            padding:30px;
            text-align:center;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
            cursor:pointer;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            color:#006341;
        }

    </style>
</head>

<body>

<h1>S&P Campaigns Calculator</h1>

<p style="text-align:center;">
Select a campaign to calculate your estimated rewards.
</p>

<div class="container">

    <div class="card">
        <h2>Normal IA Route</h2>
        <p>Calculate reward based on accumulated FYP.</p>
    </div>

    <div class="card">
        <h2>Rookie Reward</h2>
        <p>Calculate Rookie campaign payout.</p>
    </div>

    <div class="card">
        <h2>Recruiter Bonus</h2>
        <p>Calculate bonus earned from Rookie production.</p>
    </div>

    <div class="card">
        <h2>MDRT Rewards</h2>
        <p>Coming Soon</p>
    </div>

</div>

</body>
</html>
