<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Normal IA Route</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#F5F5F5;
            margin:0;
            padding:30px;
            color:#1F2937;
        }

        .pageContainer{
            max-width:1200px;
            margin:0 auto;
        }

        .backBtn{
            display:inline-block;
            background:#006B3C;
            color:white;
            padding:14px 24px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:17px;
            font-weight:bold;
            margin-bottom:24px;
            transition:0.2s;
        }

        .backBtn:hover{
            background:#005330;
            transform:translateY(-2px);
        }

        .header{
            background:#006B3C;
            color:white;
            padding:46px 25px;
            border-radius:16px;
            text-align:center;
            margin-bottom:35px;
        }

        .header h1{
            margin:0 0 18px 0;
            font-size:38px;
        }

        .header p{
            margin:0;
            font-size:20px;
            font-weight:500;
        }

        .inputSection{
            width:100%;
            max-width:520px;
            margin:0 auto 35px auto;
            text-align:center;
        }

        .inputLabel{
            display:block;
            margin-bottom:12px;
            color:#006B3C;
            font-size:18px;
            font-weight:bold;
        }

        .fypInput{
            display:block;
            width:100%;
            min-height:74px;
            padding:18px 22px;
            font-size:28px;
            font-weight:bold;
            text-align:center;
            background:white;
            color:#111827;
            border:3px solid #006B3C;
            border-radius:14px;
            outline:none;
        }

        .fypInput:focus{
            border-color:#FFB81C;
            box-shadow:0 0 0 4px rgba(255,184,28,0.25);
        }

        .fypInput::placeholder{
            color:#9CA3AF;
            font-weight:normal;
        }

        .calculateBtn{
            display:block;
            width:100%;
            min-height:74px;
            margin-top:16px;
            padding:18px 22px;
            font-size:22px;
            font-weight:bold;
            border:none;
            border-radius:14px;
            background:#FFB81C;
            color:#003B2F;
            cursor:pointer;
            transition:0.2s;
        }

        .calculateBtn:hover{
            background:#FFC94D;
            transform:translateY(-2px);
            box-shadow:0 6px 14px rgba(0,0,0,0.15);
        }

        .calculateBtn:active{
            transform:translateY(0);
        }

        .errorMessage{
            color:#B91C1C;
            font-size:16px;
            font-weight:bold;
            margin-top:14px;
            min-height:20px;
        }

        .results{
            display:grid;
            gap:20px;
        }

        .card{
            background:white;
            padding:28px 32px;
            border-radius:16px;
            box-shadow:0 4px 14px rgba(0,0,0,0.1);
            border-left:7px solid #006B3C;
        }

        .cardTitle{
            color:#006B3C;
            font-weight:bold;
            font-size:20px;
            line-height:1.5;
        }

        .amount{
            color:#111827;
            font-size:34px;
            font-weight:bold;
            margin-top:12px;
            line-height:1.3;
        }

        .supportingText{
            color:#4B5563;
            font-size:18px;
            font-weight:bold;
            margin-top:8px;
            line-height:1.5;
        }

        .variableCard{
            border-left-color:#FFB81C;
        }

        .variableCard .cardTitle{
            color:#8A5A00;
        }

        .growthCard{
            border-left-color:#2563EB;
        }

        .growthCard .cardTitle{
            color:#1D4ED8;
        }

        .disclaimer{
            margin-top:28px;
            padding:18px;
            background:#EAF6EF;
            border-radius:12px;
            color:#374151;
            font-size:14px;
            line-height:1.6;
            text-align:center;
        }

        @media(max-width:600px){

            body{
                padding:18px;
            }

            .header{
                padding:34px 18px;
            }

            .header h1{
                font-size:29px;
            }

            .header p{
                font-size:17px;
            }

            .fypInput{
                font-size:24px;
            }

            .calculateBtn{
                font-size:19px;
            }

            .card{
                padding:24px 22px;
            }

            .amount{
                font-size:28px;
            }

        }

    </style>

</head>

<body>

<div class="pageContainer">

    <button
        class="backBtn"
        onclick="location.href='index.html'"
    >
        ← Back to Home
    </button>

    <div class="header">

        <h1>💰 Normal IA Route</h1>

        <p>
            Enter your accumulated Campaign FYP
        </p>

    </div>

    <div class="inputSection">

        <label
            class="inputLabel"
            for="fyp"
        >
            Accumulated Campaign FYP
        </label>

        <input
            type="text"
            inputmode="numeric"
            id="fyp"
            class="fypInput"
            placeholder="Example: 500,000"
            autocomplete="off"
            oninput="formatFYPInput(this)"
            onkeydown="calculateWithEnter(event)"
        >

        <button
            class="calculateBtn"
            onclick="calculate()"
        >
            CALCULATE REWARD
        </button>

        <div
            id="errorMessage"
            class="errorMessage"
        ></div>

    </div>

    <div
        id="results"
        class="results"
    ></div>

    <div class="disclaimer">
        Estimated results are for reference only and remain subject
        to official campaign terms, eligibility validation and final
        company verification.
    </div>

</div>

<script>

    function formatFYPInput(input){

        let numbersOnly =
            input.value.replace(/[^0-9]/g, "");

        if(numbersOnly === ""){

            input.value = "";

            return;

        }

        let numericValue =
            parseInt(numbersOnly, 10);

        input.value =
            numericValue.toLocaleString("en-US");

    }


    function calculateWithEnter(event){

        if(event.key === "Enter"){

            calculate();

        }

    }


    function formatMMK(amount){

        return Math.round(amount).toLocaleString("en-US");

    }


    function showFixedResults(
        reward,
        nextReward,
        needMore
    ){

        document.getElementById("results").innerHTML = `

            <div class="card">

                <div class="cardTitle">
                    💰 CURRENT REWARD
                </div>

                <div class="amount">
                    MMK ${formatMMK(reward)}
                </div>

            </div>

            <div class="card">

                <div class="cardTitle">
                    🏆 NEXT REWARD
                </div>

                <div class="amount">
                    MMK ${formatMMK(nextReward)}
                </div>

            </div>

            <div class="card growthCard">

                <div class="cardTitle">
                    📈 FYP REQUIRED
                </div>

                <div class="amount">
                    MMK ${formatMMK(needMore)}
                </div>

                <div class="supportingText">
                    Additional FYP needed to reach your next reward.
                </div>

            </div>

        `;

    }


    function showVariableResults(
        reward,
        rate,
        extraReward
    ){

        document.getElementById("results").innerHTML = `

            <div class="card">

                <div class="cardTitle">
                    💰 CURRENT REWARD
                </div>

                <div class="amount">
                    MMK ${formatMMK(reward)}
                </div>

            </div>

            <div class="card variableCard">

                <div class="cardTitle">
                    🏆 VARIABLE REWARD
                </div>

                <div class="amount">
                    ${rate}% OF YOUR FYP
                </div>

            </div>

            <div class="card growthCard">

                <div class="cardTitle">
                    📈 FOR EVERY ADDITIONAL
                </div>

                <div class="amount">
                    MMK 100,000 FYP
                </div>

                <div class="supportingText">
                    YOU WILL EARN
                </div>

                <div class="amount">
                    MMK ${formatMMK(extraReward)}
                    MORE REWARD
                </div>

            </div>

        `;

    }


    function calculate(){

        let inputValue =
            document.getElementById("fyp").value;

        let cleanedValue =
            inputValue.replace(/,/g, "");

        let fyp =
            parseInt(cleanedValue, 10);

        let errorMessage =
            document.getElementById("errorMessage");

        errorMessage.innerHTML = "";

        if(
            isNaN(fyp) ||
            fyp < 0
        ){

            errorMessage.innerHTML =
                "Please enter a valid FYP amount.";

            document.getElementById("results").innerHTML = "";

            return;

        }


        let reward = 0;
        let nextReward = 0;
        let needMore = 0;


        if(fyp < 200000){

            reward = 0;
            nextReward = 25000;
            needMore = 200000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 500000){

            reward = 25000;
            nextReward = 50000;
            needMore = 500000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 1000000){

            reward = 50000;
            nextReward = 100000;
            needMore = 1000000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 2000000){

            reward = 100000;
            nextReward = 200000;
            needMore = 2000000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 3000000){

            reward = 200000;
            nextReward = 300000;
            needMore = 3000000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 4000000){

            reward = 300000;
            nextReward = 400000;
            needMore = 4000000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp < 5000000){

            reward = 400000;
            nextReward = 600000;
            needMore = 5000000 - fyp;

            showFixedResults(
                reward,
                nextReward,
                needMore
            );

        }

        else if(fyp <= 10000000){

            reward = fyp * 0.12;

            showVariableResults(
                reward,
                12,
                12000
            );

        }

        else{

            reward = fyp * 0.15;

            showVariableResults(
                reward,
                15,
                15000
            );

        }

    }

</script>

</body>

</html>
