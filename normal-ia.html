<!DOCTYPE html>
<html>

<head>

    <title>Normal IA Route</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#F5F5F5;
            margin:0;
            padding:30px;
        }

        .header{
            background:#006341;
            color:white;
            padding:25px;
            border-radius:12px;
            text-align:center;
            margin-bottom:30px;
        }

        .backBtn{
            background:#006341;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            margin-bottom:20px;
        }

        .inputSection{
            text-align:center;
            margin-bottom:30px;
        }

        input{
            width:380px;
            padding:18px;
            font-size:24px;
            font-weight:bold;
            text-align:center;
            border-radius:12px;
            border:3px solid #006341;
        }

        .calculateBtn{
            width:420px;
            margin-top:15px;
            padding:18px;
            font-size:22px;
            font-weight:bold;
            border:none;
            border-radius:12px;
            background:#FFB81C;
            color:#003B2F;
            cursor:pointer;
        }

        .calculateBtn:hover{
            background:#FFC94D;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:12px;
            margin-top:15px;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        }

        .title{
            color:#006341;
            font-weight:bold;
            font-size:20px;
        }

        .amount{
            font-size:32px;
            font-weight:bold;
            margin-top:10px;
        }

    </style>

</head>

<body>

<button class="backBtn"
onclick="location.href='index.html'">

← Back to Home

</button>

<div class="header">

<h1>💰 Normal IA Route</h1>

<p>
Enter your accumulated Campaign FYP
</p>

</div>

<div class="inputSection">

<input
type="number"
id="fyp"
placeholder="Enter FYP">

<br>

<button
class="calculateBtn"
onclick="calculate()">

CALCULATE REWARD

</button>

</div>

<div id="results"></div>

<script>

function calculate() {

let fyp =
parseFloat(
document.getElementById("fyp").value
);

if(isNaN(fyp)){
return;
}

let reward = 0;
let nextReward = 0;
let needMore = 0;

if (fyp >= 200000)
reward = 25000;

if (fyp >= 500000)
reward = 50000;

if (fyp >= 1000000)
reward = 100000;

if (fyp >= 2000000)
reward = 200000;

if (fyp >= 3000000)
reward = 300000;

if (fyp >= 4000000)
reward = 400000;

if (fyp >= 5000000 && fyp <= 10000000)
reward = fyp * 0.12;

if (fyp >= 10000001)
reward = fyp * 0.15;


if(fyp < 200000){

nextReward = 25000;
needMore = 200000-fyp;

document.getElementById("results").innerHTML =

`

<div class="card">

<div class="title">
💰 CURRENT REWARD
</div>

<div class="amount">
MMK ${reward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
🏆 NEXT REWARD
</div>

<div class="amount">
MMK ${nextReward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
📈 FYP REQUIRED
</div>

<div class="amount">
MMK ${needMore.toLocaleString()}
</div>

</div>

`;

return;

}

if(fyp >=200000 && fyp <500000){
nextReward = 50000;
needMore = 500000-fyp;
}

else if(fyp <1000000){
nextReward = 100000;
needMore = 1000000-fyp;
}

else if(fyp <2000000){
nextReward = 200000;
needMore = 2000000-fyp;
}

else if(fyp <3000000){
nextReward = 300000;
needMore = 3000000-fyp;
}

else if(fyp <4000000){
nextReward = 400000;
needMore = 4000000-fyp;
}

else if(fyp <5000000){
nextReward = 600000;
needMore = 5000000-fyp;
}

if(fyp <5000000){

document.getElementById("results").innerHTML =

`

<div class="card">

<div class="title">
💰 CURRENT REWARD
</div>

<div class="amount">
MMK ${reward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
🏆 NEXT REWARD
</div>

<div class="amount">
MMK ${nextReward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
📈 FYP REQUIRED
</div>

<div class="amount">
MMK ${needMore.toLocaleString()}
</div>

</div>

`;

}

else if(fyp <=10000000){

document.getElementById("results").innerHTML =

`

<div class="card">

<div class="title">
💰 CURRENT REWARD
</div>

<div class="amount">
MMK ${reward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
🏆 VARIABLE REWARD
</div>

<div class="amount">
12% OF FYP
</div>

</div>

<div class="card">

<div class="title">
📈 FOR EVERY ADDITIONAL
MMK 100,000 FYP
</div>

<div class="amount">
YOU WILL EARN
MMK 12,000 MORE REWARD
</div>

</div>

`;

}

else{

document.getElementById("results").innerHTML =

`

<div class="card">

<div class="title">
💰 CURRENT REWARD
</div>

<div class="amount">
MMK ${reward.toLocaleString()}
</div>

</div>

<div class="card">

<div class="title">
🏆 VARIABLE REWARD
</div>

<div class="amount">
15% OF FYP
</div>

</div>

<div class="card">

<div class="title">
📈 FOR EVERY ADDITIONAL
MMK 100,000 FYP
</div>

<div class="amount">
YOU WILL EARN
MMK 15,000 MORE REWARD
</div>

</div>

`;

}

}

</script>

</body>

</html>
